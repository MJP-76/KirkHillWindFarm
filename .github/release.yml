changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions[bot]
  categories:
    - title: "⚠️ Breaking changes"
      labels:
        - breaking-change
        - breaking
    - title: "✨ Features"
      labels:
        - feature
        - enhancement
    - title: "📊 Dashboard"
      labels:
        - dashboard
        - ui
    - title: "🐛 Fixes"
      labels:
        - bug
        - fix
    - title: "📝 Documentation"
      labels:
        - documentation
        - docs
    - title: "🧹 Maintenance"
      labels:
        - maintenance
        - chore
        - dependencies
    - title: "Other changes"
      labels:
        - "*"
