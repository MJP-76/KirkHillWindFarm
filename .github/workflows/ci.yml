name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must be >= the requires-python of the Home Assistant release under
          # test, or pip silently backtracks to a much older HA and the import
          # checks below pass against an API that no longer exists.
          python-version: "3.14"

      - name: Install HA requirements
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant

      - name: Report resolved Home Assistant version
        run: |
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"

      - name: Validate integration structure
        run: |
          python -m compileall custom_components/kirkhill_wind

      - name: Import the integration against the installed Home Assistant
        run: |
          python -c "import custom_components.kirkhill_wind as k; print('imported', k.__name__)"

      - name: Check manifest JSON
        run: |
          python -c "import json; json.load(open('custom_components/kirkhill_wind/manifest.json'))"

      - name: Check synchronized release version
        run: |
          python scripts/version_sync.py check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant
          pip install -r requirements-dev.txt

      - name: Report resolved Home Assistant version
        run: |
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  # Proves the compatibility floor we advertise in hacs.json is real. If a
  # change starts using a Home Assistant API newer than MIN_HA_VERSION, the
  # import below fails here even though the latest-HA jobs stay green.
  min-ha:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read declared minimum Home Assistant
        id: minha
        run: |
          echo "ha=$(python scripts/version_sync.py min-ha --version)" >> "$GITHUB_OUTPUT"
          echo "py=$(python scripts/version_sync.py min-ha --python)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The Python that MIN_HA_VERSION declares, not a guess. Too old and
          # pip backtracks to a different HA release than the one pinned below.
          python-version: ${{ steps.minha.outputs.py }}

      - name: Install the minimum supported Home Assistant
        run: |
          python -m pip install --upgrade pip
          pip install "homeassistant==${{ steps.minha.outputs.ha }}"
          pip install -r requirements-dev.txt

      - name: Assert the pinned minimum was the version actually installed
        run: |
          resolved=$(python -c "from homeassistant.const import __version__; print(__version__)")
          echo "Resolved Home Assistant $resolved"
          if [ "$resolved" != "${{ steps.minha.outputs.ha }}" ]; then
            echo "::error::Expected ${{ steps.minha.outputs.ha }} but pip installed $resolved"
            exit 1
          fi

      - name: Import the integration on the minimum supported Home Assistant
        run: |
          python -c "import custom_components.kirkhill_wind as k; print('imported', k.__name__)"

      - name: Run tests on the minimum supported Home Assistant
        run: |
          pytest tests/ -v --tb=short
