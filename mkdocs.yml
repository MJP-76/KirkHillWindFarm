site_name: Kirk Hill Wind Farm
site_description: Home Assistant integration for the Kirk Hill Community Wind Farm
site_url: https://MJP-76.github.io/KirkHillWindFarm/
repo_url: https://github.com/MJP-76/KirkHillWindFarm
repo_name: MJP-76/KirkHillWindFarm
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight

nav:
  - Home: index.md
  - Installation: installation.md
  - Sensors: sensors.md
  - Dashboard: dashboard.md
  - Guides:
      - WhatsApp alerts: whatsapp-alerts.md
  - Farm reference: farm-reference.md
  - Development:
      - Release management: development/release-management.md
      - Development decisions: development/decisions.md
  - Changelog: changelog.md
