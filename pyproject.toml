[project]
name = "kirkhill-wind-farm"
version = "4.13.2"
description = "Home Assistant integration for the Kirk Hill Wind Farm dashboard"
license = "GPL-3.0-or-later"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
