                - p75
                - p90
                properties:
                  p50:
                    "$ref": "#/components/schemas/BenchmarkTarget"
                  p75:
                    "$ref": "#/components/schemas/BenchmarkTarget"
                  p90:
                    "$ref": "#/components/schemas/BenchmarkTarget"
    ForecastResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/ForecastData"
    ExtendedSeriesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/ExtendedSeriesData"
    StatisticsResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/StatisticsData"
    ComparisonResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/ComparisonData"
    CalendarResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/CalendarData"
    RecordsResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/RecordsData"
    BenchmarksResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/BenchmarksData"
    PreferencesResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - wind_speed_unit
          properties:
            wind_speed_unit:
              type: string
              enum: [mps, mph]
              description: Display preference only. Does not change the units of API readings.
    Window:
      type: object
      additionalProperties: false
      required:
        - range
        - from
        - to
        - bucket
        - scope
      properties:
        range:
          type: string
          examples:
            - 7d
        from:
          type: string
          format: date-time
          examples:
            - 2026-06-18T23:00:00Z
        to:
          type: string
          format: date-time
          examples:
            - 2026-06-25T12:34:00Z
        bucket:
          type: string
          description: Aggregation bucket chosen for the requested window.
          enum:
            - 1m
            - 10m
            - 30m
            - 1h
            - day
            - month
            - year
        scope:
          type: string
          description: Generation scope used for the response.
          enum:
            - owner
            - site
          examples:
            - owner
    CurrentReading:
      type: object
      additionalProperties: false
      required:
        - scope
        - source_interval
        - generated_at
        - complete
      properties:
        scope:
          type: string
          enum:
            - owner
            - site
          examples:
            - owner
        source_interval:
          type: string
          enum:
            - 1m
          description: Current readings are at one-minute intervals.
        generated_at:
          type: string
          format: date-time
          description: Time at which the API response was generated.
        complete:
          type: boolean
          description: True when every turbine has current power, wind speed, and state data available.
    CurrentSummary:
      type: object
      additionalProperties: false
      required:
        - total_power_kw
        - total_power_watts
        - wind_speed_mps
        - capacity_factor_percent
        - active_turbines
        - inactive_turbines
        - unknown_turbines
        - total_turbines
        - capacity_watts
        - capacity_kw
        - latest_power_at
        - latest_wind_speed_at
        - latest_status_at
        - total_generation_kwh_today
        - total_generation_wh_today
      properties:
        total_power_kw:
          type:
            - number
            - 'null'
          format: double
          description: Latest total power for the requested scope.
          examples:
            - 8420.125
        total_power_watts:
          type:
            - number
            - 'null'
          format: double
          description: Latest total power for the requested scope in watts.
          examples:
            - 8420125
        wind_speed_mps:
          type:
            - number
            - 'null'
          format: double
          description: Mean of the latest turbine wind speed readings.
          examples:
            - 9.42
        capacity_factor_percent:
          type:
            - number
            - 'null'
          format: double
          description: Latest whole-site power divided by rated site capacity. This is not changed by `scope`.
          examples:
            - 44.79
        active_turbines:
          type: integer
          examples:
            - 8
        inactive_turbines:
          type: integer
          examples:
            - 0
        unknown_turbines:
          type: integer
          examples:
            - 0
        total_turbines:
          type: integer
          examples:
            - 8
        capacity_watts:
          type: number
          format: double
          description: Rated capacity represented by the requested scope.
          examples:
            - 18800000
        capacity_kw:
          type: number
          format: double
          description: Rated capacity represented by the requested scope in kilowatts.
          examples:
            - 18800
        latest_power_at:
          type:
            - string
            - 'null'
          format: date-time
        latest_wind_speed_at:
          type:
            - string
            - 'null'
          format: date-time
        latest_status_at:
          type:
            - string
            - 'null'
          format: date-time
        total_generation_kwh_today:
          type: number
          format: double
          description: Total energy generated since the start of the current UK local day, scaled to the requested scope.
          examples:
            - 1234.567
        total_generation_wh_today:
          type: integer
          format: int64
          description: Total energy generated since the start of the current UK local day in watt-hours, scaled to the requested scope.
          examples:
            - 1234567
    CurrentTurbine:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - power_kw
        - wind_speed_mps
        - capacity_factor_percent
        - capacity_watts
        - capacity_kw
        - latest_power_at
        - latest_wind_speed_at
        - status_started_at
        - state_started_at
        - state_text
      properties:
        id:
          type: string
          pattern: '^T[1-8]$'
          examples:
            - T1
        status:
          type: string
          enum:
            - active
            - inactive
            - unknown
          description: Whether the turbine is active. Unknown means no operating state is available.
        power_kw:
          type:
            - number
            - 'null'
          format: double
          description: Latest power for this turbine and requested scope.
        wind_speed_mps:
          type:
            - number
            - 'null'
          format: double
          description: Latest wind speed for this turbine.
        capacity_factor_percent:
          type:
            - number
            - 'null'
          format: double
          description: Latest turbine power divided by the turbine's rated capacity.
        capacity_watts:
          type: number
          format: double
          description: Rated turbine capacity represented by the requested scope.
        capacity_kw:
          type: number
          format: double
          description: Rated turbine capacity represented by the requested scope in kilowatts.
        latest_power_at:
          type:
            - string
            - 'null'
          format: date-time
        latest_wind_speed_at:
          type:
            - string
            - 'null'
          format: date-time
        status_started_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the turbine last changed between active and inactive. Null if unknown.
        state_started_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the current uninterrupted operating state began.
        state_text:
          type:
            - string
            - 'null'
          description: Latest operating-state description for this turbine.
          examples:
            - 'Normal operation: Turbine in operation'
    CurrentResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - reading
            - summary
            - turbines
          properties:
            reading:
              $ref: '#/components/schemas/CurrentReading'
            summary:
              $ref: '#/components/schemas/CurrentSummary'
            turbines:
              type: array
              items:
                $ref: '#/components/schemas/CurrentTurbine'
    Summary:
      type: object
      additionalProperties: false
      required:
        - total_generation_kwh
        - co2_avoided_kg
        - co2_avoided_assumed_export_factor
        - co2_avoided_coverage_percent
        - co2_avoided_matched_intervals
        - co2_avoided_expected_intervals
        - co2_avoided_complete
        - latest_carbon_intensity_at
        - capacity_factor_percent
        - active_turbines
        - capacity_watts
        - capacity_kw
        - latest_generation_interval_end
        - latest_import_status
      properties:
        total_generation_kwh:
          type: number
          format: double
          description: Total generation for the requested scope.
          examples:
            - 123456.789
        co2_avoided_kg:
          type:
            - number
            - 'null'
          format: double
          description: Indicative CO2 avoided by matched intervals for the requested scope.
          examples:
            - 18432.125
        co2_avoided_assumed_export_factor:
          type: number
          format: double
          description: Assumed proportion of gross generation exported to the grid.
          examples:
            - 0.99
        co2_avoided_coverage_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage of expected half-hour intervals with both complete generation and estimated actual carbon intensity data.
        co2_avoided_matched_intervals:
          type: integer
          minimum: 0
        co2_avoided_expected_intervals:
          type: integer
          minimum: 0
        co2_avoided_complete:
          type: boolean
          description: True when every expected half-hour interval is included.
        latest_carbon_intensity_at:
          type:
            - string
            - 'null'
          format: date-time
        capacity_factor_percent:
          type:
            - number
            - 'null'
          format: double
          description: Whole-farm capacity factor for the time covered by comparable readings from all turbines. This may cover less time than the generation total. Null if there is not enough comparable data. Does not change with scope.
          examples:
            - 40.8
        active_turbines:
          type: integer
          examples:
            - 8
          description: Turbines whose latest known operating state is active, regardless of the selected generation period. Missing states are not counted as active.
        capacity_watts:
          type: number
          format: double
          description: Rated capacity represented by the requested scope.
          examples:
            - 18800000
        capacity_kw:
          type: number
          format: double
          description: Rated capacity represented by the requested scope in kilowatts.
          examples:
            - 18800
        latest_generation_interval_end:
          type:
            - string
            - 'null'
          format: date-time
          description: Oldest contributing turbine end within the selected window, or null if a turbine has no known generation. A mixed-period total can include newer readings from other turbines.
          examples:
            - 2026-06-25T12:30:00Z
        latest_import_status:
          type:
            - string
            - 'null'
          examples:
            - completed
    SummaryResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - window
            - summary
          properties:
            window:
              $ref: '#/components/schemas/Window'
            summary:
              $ref: '#/components/schemas/Summary'
    GenerationPoint:
