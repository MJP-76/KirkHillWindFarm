          additionalProperties: false
          required:
            - window
            - turbines
          properties:
            window:
              $ref: '#/components/schemas/Window'
            turbines:
              type: array
              items:
                $ref: '#/components/schemas/Turbine'
    Error:
      type: object
      additionalProperties: true
      required:
        - message
      properties:
        message:
