          type:
            - number
            - 'null'
          format: double
          description: Indicative CO2 avoided by matched intervals for the requested scope.
        generation_kwh:
          type:
            - number
            - 'null'
          format: double
          description: Generation included in the estimate for the requested scope.
        assumed_export_factor:
          type: number
          format: double
          examples:
            - 0.99
        coverage_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
        matched_intervals:
          type: integer
          minimum: 0
        expected_intervals:
          type: integer
          minimum: 0
        complete:
          type: boolean
        latest_intensity_at:
          type:
            - string
            - 'null'
          format: date-time
    CarbonAvoidedPoint:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - interval_end
        - duration_seconds
        - co2_avoided_kg
        - generation_kwh
        - grid_intensity_gco2_per_kwh
        - coverage_percent
        - matched_intervals
        - expected_intervals
        - complete
      properties:
        timestamp:
          type: string
          format: date-time
        interval_end:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          minimum: 0
        co2_avoided_kg:
          type:
            - number
            - 'null'
          format: double
        generation_kwh:
          type:
            - number
            - 'null'
          format: double
        grid_intensity_gco2_per_kwh:
          type:
            - number
            - 'null'
          format: double
          description: Generation-weighted NESO estimated actual GB grid carbon intensity for the bucket.
        coverage_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
        matched_intervals:
          type: integer
          minimum: 0
        expected_intervals:
          type: integer
          minimum: 0
        complete:
          type: boolean
    CarbonAvoidedResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - window
            - summary
            - series
          properties:
            window:
              $ref: '#/components/schemas/Window'
            summary:
              $ref: '#/components/schemas/CarbonAvoidedSummary'
            series:
              type: array
              items:
                $ref: '#/components/schemas/CarbonAvoidedPoint'
    WindSpeedPoint:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - wind_speed_mps
      properties:
        timestamp:
          type: string
          format: date-time
        wind_speed_mps:
          type: number
          format: double
          description: Mean wind speed in metres per second.
    WindSpeedResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - window
            - series
          properties:
            window:
              $ref: '#/components/schemas/Window'
            series:
              type: array
              items:
                $ref: '#/components/schemas/WindSpeedPoint'
    Coordinates:
      type: object
      additionalProperties: false
      required:
        - latitude
        - longitude
        - source
        - openstreetmap_node_id
      properties:
        latitude:
          type:
            - number
            - 'null'
          format: double
        longitude:
          type:
            - number
            - 'null'
          format: double
        source:
          type:
            - string
            - 'null'
          examples:
            - OpenStreetMap
        openstreetmap_node_id:
          type:
            - integer
            - 'null'
    Turbine:
      type: object
      additionalProperties: false
      required:
        - id
        - generation_kwh
        - generation_share_percent
        - capacity_factor_percent
        - capacity_watts
        - capacity_kw
        - latest_generation_interval_end
        - latest_rotor_speed_rpm
        - latest_rotor_speed_at
        - coordinates
      properties:
        id:
          type: string
          pattern: '^T[1-8]$'
          examples:
            - T1
        generation_kwh:
          type: number
          format: double
          description: Per-turbine generation for the requested scope.
        generation_share_percent:
          type:
            - number
            - 'null'
          format: double
          description: Share of scoped generation produced by this turbine.
        capacity_factor_percent:
          type:
            - number
            - 'null'
          format: double
          description: Turbine capacity factor over the period covered by its readings. Null if coverage is insufficient. Does not change with scope.
        capacity_watts:
          type: number
          format: double
          description: Rated turbine capacity represented by the requested scope.
        capacity_kw:
          type: number
          format: double
          description: Rated turbine capacity represented by the requested scope in kilowatts.
        latest_generation_interval_end:
          type:
            - string
            - 'null'
          format: date-time
        latest_rotor_speed_rpm:
          type:
            - number
            - 'null'
          format: double
        latest_rotor_speed_at:
          type:
            - string
            - 'null'
          format: date-time
        coordinates:
          $ref: '#/components/schemas/Coordinates'
    TurbinesResponse:
