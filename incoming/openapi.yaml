          - site
        now:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        forecasted_at:
          type: string
          format: date-time
        weather_run_at:
          type: string
          format: date-time
        model_version:
          type: string
        operational_stale:
          type: boolean
        weather_stale:
          type: boolean
        estimate_type:
          const: point_estimate
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - date
            - from
            - to
            - forecast_from
            - complete
            - energy_kwh
            - points
            properties:
              key:
                enum:
                - today
                - tomorrow
              date:
                type: string
                format: date
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
              forecast_from:
                type: string
                format: date-time
              complete:
                type: boolean
              energy_kwh:
                type:
                - number
                - 'null'
              points:
                type: array
                items:
                  "$ref": "#/components/schemas/ForecastPoint"
    ExtendedSeriesData:
      type: object
      additionalProperties: false
      required:
      - window
