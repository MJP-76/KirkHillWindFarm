openapi: 3.1.0
info:
  title: Kirk Hill Wind Farm API
  version: 1.0.0
  summary: Read-only wind farm data API for the Kirk Hill dashboard.
  description: >
    Explore generation, wind, forecasts and CO2 avoided for your share or the
    whole wind farm. Access is read-only. Use `scope=site` for whole-farm data
    when your key allows it. Readings default to your share when permitted;
    whole-farm-only keys default to whole-farm data.
    Apart from ownership wattage and your wind-speed preference, personal
    account information is not shared. Wind and capacity factor do not change
    with your share. Do not cache or share responses between accounts.
    All timestamps in responses are UTC ISO-8601 strings.


    API requests are rate limited per account (120 requests per minute by
    default, shared across all of an account's API keys). Exceeding the limit
    returns `429 Too Many Requests` with a `Retry-After` header telling you how
    long to wait. Contact support if you need a higher limit.


    AI clients can also connect using MCP Streamable HTTP at
    `https://dashboard.kirkhillcoop.org/mcp`. Authenticate with OAuth or a manual
    API key in the Authorization header. Read the
    [MCP setup guide](https://dashboard.kirkhillcoop.org/mcp.md) for configuration,
    connection steps, examples and troubleshooting.


    See the [API changelog](https://dashboard.kirkhillcoop.org/api-docs#api-changelog)
    for REST and MCP additions, unreleased features and compatibility notes.
servers:
  - url: https://dashboard.kirkhillcoop.org
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Wind farm data
    description: Read-only generation, wind speed, indicative carbon avoided, and turbine status data.
paths:
  /api/v1/preferences:
    get:
      tags:
        - Wind farm data
      summary: Get display preferences
      description: >
        Read your saved wind-speed unit (mps or mph), with mps as the default.
        Available with any data permission. Accepts no query parameters;
        extra parameters return 422. Wind readings remain in metres per second,
        so convert them for display if needed. Theme and other account settings
        are not returned.
      operationId: getWindFarmPreferences
      responses:
        '200':
          description: Your wind-speed display preference.
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'no-store, private'
            Vary:
              schema:
                type: string
                const: Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
              example:
                data:
                  wind_speed_unit: mps
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: The key holder cannot access wind farm data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Query parameters are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This endpoint does not accept query parameters.
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/current:
    get:
      tags:
        - Wind farm data
      summary: Get current wind farm readings
      description: >
        Returns the latest 1-minute power and wind readings, the latest
        turbine state text, and current capacity factor. Power values default to
        the API key holder's share of the wind farm; use `scope=site` for
        whole-site power values. Capacity factor, wind speed, and turbine
        active/inactive state are physical readings and are not changed by
        `scope`.
      operationId: getWindFarmCurrent
      parameters:
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Current wind farm readings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
  /api/v1/summary:
    get:
      tags:
        - Wind farm data
      summary: Get wind farm summary
      description: Returns scoped generation totals, capacity factor, turbine count, and latest data status.
      operationId: getWindFarmSummary
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Wind farm summary for the requested range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
  /api/v1/generation:
    get:
      tags:
        - Wind farm data
      summary: Get site generation time series
      description: Returns energy generation in kWh for each bucket in the requested range and scope.
      operationId: getWindFarmGeneration
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Site generation time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
  /api/v1/wind-speed:
    get:
      tags:
        - Wind farm data
      summary: Get wind speed time series
      description: Returns mean recorded wind speed in metres per second for each bucket in the requested range.
      operationId: getWindFarmWindSpeed
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Wind speed time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindSpeedResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
  /api/v1/carbon-avoided:
    get:
      tags:
        - Wind farm data
      summary: Get indicative CO2 avoided
      description: >
        Returns indicative CO2 avoided for the requested range. Each complete
        30-minute gross-generation interval is weighted by the matching NESO
        estimated actual GB grid carbon intensity and the configured assumed
        export factor. Generation and avoided-emissions values default to the
        API key holder's share; use `scope=site` for whole-wind-farm values.
        Coverage fields explicitly identify missing generation or carbon data.
      operationId: getWindFarmCarbonAvoided
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Indicative carbon avoided for the requested range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonAvoidedResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
  /api/v1/turbines:
    get:
      tags:
        - Wind farm data
      summary: Get turbine status
      description: Returns scoped per-turbine generation, capacity factor, coordinates, and latest rotor speed.
      operationId: getWindFarmTurbines
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Per-turbine status rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurbinesResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
  "/api/v1/forecast":
    get:
      tags:
      - Wind farm data
      operationId: getForecast
      summary: Generation and wind forecasts
      description: Predicted generation and wind for the rest of today and tomorrow.
        Check status and complete for old or incomplete predictions. These are
        estimates, not guarantees or P50 expectations. Today's total covers only
        the remaining time, not the whole day.
      parameters:
      - "$ref": "#/components/parameters/Scope"
      responses:
        '200':
          description: Read-only result.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ForecastResponse"
        '401':
          "$ref": "#/components/responses/Unauthorised"
        '403':
          description: The API key does not permit the requested scope.
        '422':
          "$ref": "#/components/responses/ValidationError"
        '423':
          "$ref": "#/components/responses/PasswordChangeRequired"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/carbon-avoided/forecast":
    get:
      tags: [Wind farm data]
      operationId: getCarbonAvoidedForecast
      summary: Indicative CO2 avoided predictions
      description: >-
        Indicative CO2 savings for the rest of today and tomorrow in UK local time.
        Uses predicted generation, forecast GB grid carbon intensity and the
        assumed export rate. Today's first interval starts now. Totals include
        only times with enough data; check complete and coverage_percent before
        presenting them as full predictions. Separate from historical CO2 figures.
      parameters:
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Indicative forecasts, not metered savings or P50 budgets.
          headers:
            Cache-Control:
              schema: {type: string, const: 'private, no-store'}
            Vary:
              schema: {type: string, const: Authorization}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonForecastResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: The API key does not permit the requested scope.
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/api/v1/weather-forecast":
    get:
      tags:
        - Wind farm data
      operationId: getWeatherForecast
      summary: Hourly weather forecasts
      description: >-
        Predicted wind speed, direction, temperature and surface air pressure,
        shown separately for each weather model. Covers the next whole UTC hour
        (including now if on the hour) through tomorrow in UK local time.
        Check status and complete for old or partial forecasts. Missing values
        are null; unavailable models have no points. Weather values and units
        are the same for your share and the whole farm.
      parameters:
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Modelled weather, not turbine observations. Preserve provider/model attribution.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            Vary:
              schema:
                type: string
                const: Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherForecastResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: The API key does not permit the requested scope.
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/PasswordChangeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/api/v1/series":
    get:
      tags:
      - Wind farm data
      operationId: getExtendedSeries
      summary: Detailed generation or wind history
      description: Explore readings for a chosen turbine and time interval.
        Missing values are null, not zero. Generation estimated across gaps is
        marked as interpolated; wind averages include the number of readings used.
      parameters:
      - "$ref": "#/components/parameters/Scope"
      - "$ref": "#/components/parameters/Range"
      - name: from
        in: query
        required: false
        description: Inclusive custom timestamp with timezone; only with range=custom.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Exclusive custom timestamp with timezone; only with range=custom.
        schema:
          type: string
          format: date-time
      - name: resolution
        in: query
        required: false
        description: UTC buckets. Maximum 48h at 1m, 90 days at 10m, 365 days at 1h;
          day for longer. Automatic when omitted.
        schema:
          type: string
          enum:
          - 1m
          - 10m
          - 1h
          - day
      - name: turbine
        in: query
        required: false
        description: Filter readings by turbine; ownership still scales by the whole-farm
          share.
        schema:
          type: string
          pattern: "^T[1-8]$"
      - name: metric
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - generation_kwh
          - wind_speed_mps
          default: generation_kwh
      responses:
        '200':
          description: Read-only result.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExtendedSeriesResponse"
        '401':
          "$ref": "#/components/responses/Unauthorised"
        '403':
          description: The API key does not permit the requested scope.
        '422':
          "$ref": "#/components/responses/ValidationError"
        '423':
          "$ref": "#/components/responses/PasswordChangeRequired"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/generation/cumulative":
    get:
      tags:
      - Wind farm data
      operationId: getExtendedSeriesCumulative
      summary: Running generation totals
      description: Running totals include known generation during gaps, with
        estimates identified. Unknown values remain null, and totals stop at the
        last supported reading. Check complete before using a full-period total.
        The metric parameter is not accepted.
      parameters:
      - "$ref": "#/components/parameters/Scope"
      - "$ref": "#/components/parameters/Range"
      - name: from
        in: query
        required: false
        description: Inclusive custom timestamp with timezone; only with range=custom.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Exclusive custom timestamp with timezone; only with range=custom.
        schema:
          type: string
          format: date-time
      - name: resolution
        in: query
        required: false
        description: UTC buckets. Maximum 48h at 1m, 90 days at 10m, 365 days at 1h;
          day for longer. Automatic when omitted.
        schema:
          type: string
          enum:
          - 1m
          - 10m
          - 1h
          - day
      - name: turbine
        in: query
        required: false
        description: Filter readings by turbine; ownership still scales by the whole-farm
          share.
        schema:
          type: string
          pattern: "^T[1-8]$"
      responses:
        '200':
          description: Read-only result.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExtendedSeriesResponse"
        '401':
          "$ref": "#/components/responses/Unauthorised"
        '403':
          description: The API key does not permit the requested scope.
        '422':
          "$ref": "#/components/responses/ValidationError"
        '423':
          "$ref": "#/components/responses/PasswordChangeRequired"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/statistics":
    get:
      tags:
      - Wind farm data
      operationId: getStatistics
      summary: Daily and monthly statistics
      description: Explore daily or monthly generation, wind, CO2 and performance.
        The current month is marked as month-to-date, with P50 expectations for
        the elapsed time. Missing figures include reasons; use the calendar to
        see wholly missing or pending periods. Unavailable statistics return no
        rows with meta.status=unavailable.
      parameters:
      - "$ref": "#/components/parameters/Scope"
      - name: period
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - day
          - month
          default: month
      - name: from
        in: query
        required: false
        description: Inclusive UK date, from 2024 onward and not after today.
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: Inclusive UK date, not before from or after today.
        schema:
          type: string
          format: date
      - name: order_by
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - date
          - generation_kwh
          - wind_speed_mps
          - capacity_factor_percent
          - vs_p50_percent
          - co2_avoided_kg
          - p50_kwh
          default: date
      - name: direction
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
      - name: per_page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          enum:
          - 25
          - 50
          - 100
          default: 25
      responses:
        '200':
          description: Read-only result.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StatisticsResponse"
        '401':
          "$ref": "#/components/responses/Unauthorised"
        '403':
          description: The API key does not permit the requested scope.
        '422':
          "$ref": "#/components/responses/ValidationError"
        '423':
          "$ref": "#/components/responses/PasswordChangeRequired"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/statistics/compare":
    get:
      tags:
      - Wind farm data
      operationId: getComparison
      summary: Compare years
      description: Compare monthly figures across two or three years. Check
        is_complete before comparing a partial month with a full month.
        Percentage metrics use percentage-point differences.
      parameters:
      - "$ref": "#/components/parameters/Scope"
      - name: metric
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - generation_kwh
          - wind_speed_mps
          - capacity_factor_percent
          - vs_p50_percent
          - co2_avoided_kg
          default: generation_kwh
      - name: years[]
        in: query
        required: true
        description: Ordered years; first is baseline. Encode as years[]=2025&years[]=2026.
        schema:
          type: array
          items:
            type: integer
            minimum: 2024
            description: No later than the current year.
          minItems: 2
          maxItems: 3
          uniqueItems: true
        style: form
        explode: true
      responses:
        '200':
          description: Read-only result.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ComparisonResponse"
        '401':
          "$ref": "#/components/responses/Unauthorised"
        '403':
          description: The API key does not permit the requested scope.
        '422':
          "$ref": "#/components/responses/ValidationError"
        '423':
          "$ref": "#/components/responses/PasswordChangeRequired"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/statistics/calendar":
    get:
      tags:
      - Wind farm data
      operationId: getCalendar
      summary: Daily metric calendar
      description: See a reading for each UK calendar day, with missing or
        incomplete days identified. Day lengths allow for the clocks changing.
      parameters:
      - "$ref": "#/components/parameters/Scope"
      - name: metric
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - generation_kwh
          - wind_speed_mps
          - capacity_factor_percent
          - vs_p50_percent
          - co2_avoided_kg
          default: generation_kwh
      - name: year
        in: query
        required: true
        description: Calendar year from 2024 through the current year.
        schema:
          type: integer
          minimum: 2024
          description: No later than the current year.
      responses:
        '200':
          description: Read-only result.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalendarResponse"
        '401':
          "$ref": "#/components/responses/Unauthorised"
        '403':
          description: The API key does not permit the requested scope.
        '422':
          "$ref": "#/components/responses/ValidationError"
        '423':
          "$ref": "#/components/responses/PasswordChangeRequired"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/records":
    get:
      tags:
      - Wind farm data
      operationId: getRecords
      summary: Record rankings
      description: Explore top-three rankings, with dates and partial months
        identified. Monthly P50 records are judged against the whole month's
        target, even before the month ends. Your share scales energy and CO2,
        not wind or percentages. Check coverage for CO2 estimates.
      parameters:
      - "$ref": "#/components/parameters/Scope"
      responses:
        '200':
          description: Read-only result.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RecordsResponse"
        '401':
          "$ref": "#/components/responses/Unauthorised"
        '403':
          description: The API key does not permit the requested scope.
        '422':
          "$ref": "#/components/responses/ValidationError"
        '423':
          "$ref": "#/components/responses/PasswordChangeRequired"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/benchmarks":
    get:
      tags:
      - Wind farm data
      operationId: getBenchmarks
      summary: P50, P75 and P90 benchmarks
      description: Compare generation with long-term expectations, separately for
        your chosen period and the whole month. Includes expected capacity factors.
        Check completeness before comparing totals. These are not weather forecasts.
      parameters:
      - "$ref": "#/components/parameters/Scope"
      - "$ref": "#/components/parameters/Range"
      - name: from
        in: query
        required: false
        description: Inclusive custom timestamp with timezone; only with range=custom.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Exclusive custom timestamp with timezone; only with range=custom.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Read-only result.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BenchmarksResponse"
        '401':
          "$ref": "#/components/responses/Unauthorised"
        '403':
          description: The API key does not permit the requested scope.
        '422':
          "$ref": "#/components/responses/ValidationError"
        '423':
          "$ref": "#/components/responses/PasswordChangeRequired"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Kirk Hill API key
      description: 'Dashboard-generated API key sent as `Authorization: Bearer <token>`.'
  parameters:
    Range:
      name: range
      in: query
      required: false
      description: >
        Requested time range. Named ranges use Europe/London local day boundaries
        and response timestamps are returned in UTC. Four-digit years from 2024
        through the current dashboard year are also accepted, for example `2024`.
        The current year behaves like year-to-date; completed years cover the
        full UK-local calendar year.
      schema:
        oneOf:
          - type: string
            enum:
              - today
              - yesterday
              - 7d
              - 30d
              - mtd
              - last_month
              - ytd
              - all
              - custom
          - type: string
            pattern: '^\d{4}$'
            example: '2024'
        default: 7d
    From:
      name: from
      in: query
      required: false
      description: Required when `range=custom`. ISO-8601 timestamp.
      schema:
        type: string
        format: date-time
        examples:
          - 2026-06-01T00:00:00Z
    Scope:
      name: scope
      in: query
      required: false
      description: >
        Generation scope. `owner` is the default and returns values scaled to
        the API key holder's share of the wind farm. `site` returns whole-site
        values. This parameter does not change wind speed readings. Keys can
        be limited to owner-share data, whole-site data, or both. Owner-only
        keys reject `scope=site`; site-only keys default to `site` and reject
        `scope=owner`.
      schema:
        type: string
        enum:
          - owner
          - site
        default: owner
    To:
      name: to
      in: query
      required: false
      description: Required when `range=custom`. ISO-8601 timestamp after `from`.
      schema:
        type: string
        format: date-time
        examples:
          - 2026-06-02T00:00:00Z
  responses:
    Unauthorised:
      description: Missing, invalid, revoked, or inactive API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              value:
                message: 'Use an API key in the Authorization: Bearer header.'
            invalidToken:
              value:
                message: The API key is not valid.
            expiredToken:
              value:
                message: This API key has expired after 90 days of inactivity. Reactivate it in your dashboard account settings before using it again.
    PasswordChangeRequired:
      description: The dashboard user must change their password before API keys can be used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Please change your dashboard password before using API keys.
    ValidationError:
      description: Invalid range or timestamp parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: >
        The account exceeded its per-minute request limit, which is shared
        across all of the account's API keys. The default limit is 120 requests
        per minute; a `Retry-After` header (seconds) is returned. Contact
        support if you need a higher limit for your account.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too many requests. Please slow down and try again shortly.
  schemas:
    CarbonForecastPoint:
      type: object
      additionalProperties: false
      required: [from, to, co2_avoided_kg, generation_kwh, grid_intensity_gco2_per_kwh, carbon_retrieved_at]
      properties:
        from:
          type: string
          format: date-time
          description: Inclusive UTC boundary; first interval starts at request time.
        to:
          type: string
          format: date-time
          description: Exclusive UTC half-hour boundary.
        co2_avoided_kg:
          type: [number, 'null']
          minimum: 0
          description: Predicted kilograms, rounded to six decimals. Null if either input is unavailable.
        generation_kwh:
          type: [number, 'null']
          minimum: 0
          description: Predicted gross generation in kWh for this interval, scaled to scope.
        grid_intensity_gco2_per_kwh:
          type: [number, 'null']
          minimum: 0
          description: NESO forecast national GB intensity, never ownership-scaled.
        carbon_retrieved_at:
          type: [string, 'null']
          format: date-time
          description: When we received the carbon forecast, not when NESO issued it. Null if unavailable.
    CarbonForecastDay:
      type: object
      additionalProperties: false
      required: [key, date, from, to, forecast_from, status, complete, co2_avoided_kg, expected_intervals, matched_intervals, expected_seconds, covered_seconds, coverage_percent, points]
      properties:
        key:
          type: string
          enum: [today, tomorrow]
        date:
          type: string
          format: date
          description: UK calendar date.
        from:
          type: string
          format: date-time
          description: Start of UK calendar day, in UTC; not the start of today's subtotal.
        to:
          type: string
          format: date-time
          description: Exclusive end of UK calendar day, in UTC.
        forecast_from:
          type: string
          format: date-time
          description: Start of remaining prediction and subtotal; now for today, day start for tomorrow.
        status:
          type: string
          enum: [ready, stale, unavailable]
          description: Generation freshness when any CO2 interval is usable, otherwise unavailable. Independent of coverage.
        complete:
          type: boolean
          description: Every second from forecast_from to to has both usable forecast inputs.
        co2_avoided_kg:
          type: [number, 'null']
          minimum: 0
          description: Sum of supported intervals only; null when none. Today's subtotal is remaining time, not a whole-day prediction.
        expected_intervals:
          type: integer
          minimum: 0
        matched_intervals:
          type: integer
          minimum: 0
        expected_seconds:
          type: integer
          minimum: 0
        covered_seconds:
          type: integer
          minimum: 0
        coverage_percent:
          type: number
          minimum: 0
          maximum: 100
          description: Duration-weighted input coverage, rounded to four decimals; not confidence.
        points:
          type: array
          items:
            $ref: '#/components/schemas/CarbonForecastPoint'
    CarbonForecastData:
      type: object
      additionalProperties: false
      required: [status, scope, now, timezone, estimate_type, intensity_source, assumed_export_factor, carbon_forecast_max_age_minutes, generation_status, generated_at, forecasted_at, weather_run_at, model_version, days]
      properties:
        status:
          type: string
          enum: [ready, stale, unavailable]
          description: Generation freshness when any CO2 interval is usable, otherwise unavailable. A ready forecast can be incomplete.
        scope:
          type: string
          enum: [owner, site]
        now:
          type: string
          format: date-time
        timezone:
          type: string
          const: Europe/London
        estimate_type:
          type: string
          const: indicative_forecast
        intensity_source:
          type: string
          const: neso_national_forecast
        assumed_export_factor:
          type: number
          minimum: 0
          maximum: 1
          description: Assumed proportion of generation exported to the grid, normally 0.99.
        carbon_forecast_max_age_minutes:
          type: integer
          minimum: 30
          description: Maximum age of usable carbon forecast data, currently 180 minutes.
        generation_status:
          type: string
          enum: [ready, stale, unavailable]
        generated_at:
          type: [string, 'null']
          format: date-time
          description: When the generation forecast was produced.
        forecasted_at:
          type: [string, 'null']
          format: date-time
          description: Generation forecast source run time.
        weather_run_at:
          type: [string, 'null']
          format: date-time
        model_version:
          type: [string, 'null']
        days:
          type: array
          description: Today and tomorrow; empty if generation forecasts are unavailable. Missing CO2 predictions are null, with coverage shown.
          items:
            $ref: '#/components/schemas/CarbonForecastDay'
    CarbonForecastResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CarbonForecastData'
    WeatherForecastPoint:
      type: object
      additionalProperties: false
      required: [valid_at, wind_speed_mps, wind_direction_degrees, temperature_c, surface_pressure_hpa]
      properties:
        valid_at:
          type: string
          format: date-time
          description: UTC instant the forecast describes; not an hourly average.
        wind_speed_mps:
          type: [number, 'null']
          description: Wind speed in metres per second at the model's wind_height_m.
        wind_direction_degrees:
          type: [number, 'null']
          minimum: 0
          exclusiveMaximum: 360
          description: Direction the wind comes from, clockwise from true north. North is 0 degrees.
        temperature_c:
          type: [number, 'null']
          description: Air temperature in degrees Celsius at 2 metres above ground.
        surface_pressure_hpa:
          type: [number, 'null']
          description: Surface atmospheric pressure in hPa, not sea-level pressure.
    WeatherForecastModel:
      type: object
      additionalProperties: false
      required: [model, label, provider, wind_height_m, temperature_height_m, pressure_reference, status, forecasted_at, retrieved_at, complete, points]
      properties:
        model:
          type: string
          examples: [icon_eu]
        label:
          type: string
          examples: [ICON-EU]
        provider:
          type: string
          const: open_meteo
        wind_height_m:
          type: integer
          description: Wind forecast height above ground; currently 80 or 100 metres depending on model.
        temperature_height_m:
          type: integer
          const: 2
        pressure_reference:
          type: string
          const: surface
        status:
          type: string
          enum: [ready, stale, unavailable]
          description: >-
            Run freshness, independent of completeness. Currently stale after 18
            hours and unavailable after 36 hours; recent retrieval cannot refresh
            an old run. Missing or disabled forecasts are unavailable.
        forecasted_at:
          type: [string, 'null']
          format: date-time
          description: UTC model initialisation time; not publication or retrieval time.
        retrieved_at:
          type: [string, 'null']
          format: date-time
          description: When we last received the returned weather data, or null when unavailable.
        complete:
          type: boolean
          description: All four variables are present for every expected hourly point in the window.
        points:
          type: array
          description: >-
            Chronological hourly points; missing hours/fields remain null. No
            substitution from older runs. Empty if unavailable.
          items:
            $ref: '#/components/schemas/WeatherForecastPoint'
    WeatherForecastData:
      type: object
      additionalProperties: false
      required: [scope, now, basis, window, wind_direction_convention, models]
      properties:
        scope:
          type: string
          enum: [owner, site]
          description: Authorised key scope; weather values are identical for both scopes.
        now:
          type: string
          format: date-time
        basis:
          type: string
          const: modelled_weather
        window:
          type: object
          additionalProperties: false
          required: [from, to, interval_seconds]
          properties:
            from:
              type: string
              format: date-time
              description: Inclusive next whole UTC hour, or now when exactly on the hour.
            to:
              type: string
              format: date-time
              description: Exclusive end of tomorrow in Europe/London, returned in UTC; DST-aware.
            interval_seconds:
              type: integer
              const: 3600
        wind_direction_convention:
          type: string
          const: from_degrees_clockwise_from_true_north
        models:
          type: array
          items:
            $ref: '#/components/schemas/WeatherForecastModel'
    WeatherForecastResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WeatherForecastData'
    ForecastPoint:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      - power_kw
      - wind_speed_mps
      - nowcast
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        power_kw:
          type: number
        wind_speed_mps:
          type:
          - number
          - 'null'
        nowcast:
          type: boolean
    ForecastData:
      type: object
      additionalProperties: false
