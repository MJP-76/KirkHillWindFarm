              - interpolated
              - complete
              properties:
                timestamp:
                  type: string
                  format: date-time
                interval_end:
                  type: string
                  format: date-time
                generation_kwh:
                  type:
                  - number
                  - 'null'
                interpolated:
                  type: boolean
                complete:
                  type: boolean
            - type: object
              additionalProperties: false
              required:
              - timestamp
              - interval_end
              - cumulative_generation_kwh
              - interpolated
              - complete
              properties:
                timestamp:
                  type: string
                  format: date-time
                interval_end:
                  type: string
                  format: date-time
                cumulative_generation_kwh:
                  type:
                  - number
                  - 'null'
                interpolated:
                  type: boolean
                complete:
                  type: boolean
            - type: object
              additionalProperties: false
              required:
