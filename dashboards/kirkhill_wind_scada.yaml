            power_entity: sensor.turbine_t3_power_site
            state_entity: sensor.turbine_t3_state
            generation_today_entity: sensor.turbine_t3_generation_today
            rotor_entity: sensor.turbine_t3_rotor_speed
          - id: T4
            power_entity: sensor.turbine_t4_power_site
            state_entity: sensor.turbine_t4_state
            generation_today_entity: sensor.turbine_t4_generation_today
            rotor_entity: sensor.turbine_t4_rotor_speed
          - id: T5
            power_entity: sensor.turbine_t5_power_site
            state_entity: sensor.turbine_t5_state
            generation_today_entity: sensor.turbine_t5_generation_today
            rotor_entity: sensor.turbine_t5_rotor_speed
          - id: T6
            power_entity: sensor.turbine_t6_power_site
            state_entity: sensor.turbine_t6_state
            generation_today_entity: sensor.turbine_t6_generation_today
            rotor_entity: sensor.turbine_t6_rotor_speed
          - id: T7
            power_entity: sensor.turbine_t7_power_site
            state_entity: sensor.turbine_t7_state
            generation_today_entity: sensor.turbine_t7_generation_today
            rotor_entity: sensor.turbine_t7_rotor_speed
          - id: T8
            power_entity: sensor.turbine_t8_power_site
            state_entity: sensor.turbine_t8_state
            generation_today_entity: sensor.turbine_t8_generation_today
            rotor_entity: sensor.turbine_t8_rotor_speed
  - title: Overview
    path: overview
    icon: mdi:wind-turbine
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: entity
            name: Owner Power
            entity: sensor.kirk_hill_wind_farm_power_owner
            icon: mdi:flash
          - type: entity
            name: Site Power
            entity: sensor.kirk_hill_wind_farm_power_site
            icon: mdi:transmission-tower
          - type: gauge
            entity: sensor.kirk_hill_wind_farm_capacity_factor_owner
            name: Capacity Factor
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 20
              red: 0
          - type: entity
            name: Active Turbines
            entity: sensor.kirk_hill_wind_farm_active_turbines
            icon: mdi:wind-turbine
          - type: entity
            name: Wind Speed
            entity: sensor.kirk_hill_wind_farm_wind_speed
            icon: mdi:weather-windy
          - type: tile
            entity: binary_sensor.kirk_hill_wind_farm_alarm
            name: Alarm
            icon: mdi:alert
            color: red
          - type: button
            name: Reload integration
            icon: mdi:reload
            show_name: false
            show_state: false
            tap_action:
              action: call-service
              service: kirkhill_wind.reload_integration

