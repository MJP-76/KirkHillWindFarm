              - **All time:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_alltime_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000000000000000 %}{{ '%.2f' | format(n / 1000000000000000) }} EWh{% elif n >= 1000000000000 %}{{ '%.2f' | format(n / 1000000000000) }} PWh{% elif n >= 1000000000 %}{{ '%.2f' | format(n / 1000000000) }} TWh{% elif n >= 1000000 %}{{ '%.2f' | format(n / 1000000) }} GWh{% elif n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
          - type: entities
            title: Owner projected earnings
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_generation_value_yesterday_owner
                name: Yesterday
              - entity: sensor.kirk_hill_wind_farm_generation_value_today_owner
                name: Today
              - entity: sensor.kirk_hill_wind_farm_generation_value_week_owner
                name: Week
              - entity: sensor.kirk_hill_wind_farm_generation_value_month_owner
                name: Month
              - entity: sensor.kirk_hill_wind_farm_generation_value_ytd_owner
                name: YTD
              - entity: sensor.kirk_hill_wind_farm_generation_value_year_owner
                name: Year
              - entity: sensor.kirk_hill_wind_farm_generation_value_alltime_owner
                name: All time

      - type: grid
        cards:
          - type: heading
            heading: Whole site
            heading_style: title
          - type: markdown
            title: Site generation
            content: |
              - **Yesterday:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_yesterday_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000000000000000 %}{{ '%.2f' | format(n / 1000000000000000) }} EWh{% elif n >= 1000000000000 %}{{ '%.2f' | format(n / 1000000000000) }} PWh{% elif n >= 1000000000 %}{{ '%.2f' | format(n / 1000000000) }} TWh{% elif n >= 1000000 %}{{ '%.2f' | format(n / 1000000) }} GWh{% elif n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **Today:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_today_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000000000000000 %}{{ '%.2f' | format(n / 1000000000000000) }} EWh{% elif n >= 1000000000000 %}{{ '%.2f' | format(n / 1000000000000) }} PWh{% elif n >= 1000000000 %}{{ '%.2f' | format(n / 1000000000) }} TWh{% elif n >= 1000000 %}{{ '%.2f' | format(n / 1000000) }} GWh{% elif n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
