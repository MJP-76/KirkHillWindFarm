title: Wind Farm
views:
  - title: Overview
    path: overview
    icon: mdi:wind-turbine
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Wind Farm
            heading_style: title
            icon: mdi:wind-turbine

      - type: grid
        cards:
          - type: heading
            heading: Your share
            heading_style: title
          - type: markdown
            title: Owner generation
            content: |
              - **Yesterday:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_yesterday_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}{% set money = states('sensor.kirk_hill_wind_farm_generation_value_yesterday_owner') %}{% if money not in ['unknown', 'unavailable', 'none', ''] %} (Projected £{{ '%.2f' | format(money | float(0)) }}){% endif %}
              - **Today:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_today_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}{% set money = states('sensor.kirk_hill_wind_farm_generation_value_today_owner') %}{% if money not in ['unknown', 'unavailable', 'none', ''] %} (Projected £{{ '%.2f' | format(money | float(0)) }}){% endif %}
              - **Week:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_week_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}{% set money = states('sensor.kirk_hill_wind_farm_generation_value_week_owner') %}{% if money not in ['unknown', 'unavailable', 'none', ''] %} (Projected £{{ '%.2f' | format(money | float(0)) }}){% endif %}
              - **Month:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_month_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}{% set money = states('sensor.kirk_hill_wind_farm_generation_value_month_owner') %}{% if money not in ['unknown', 'unavailable', 'none', ''] %} (Projected £{{ '%.2f' | format(money | float(0)) }}){% endif %}
              - **YTD:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_ytd_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}{% set money = states('sensor.kirk_hill_wind_farm_generation_value_ytd_owner') %}{% if money not in ['unknown', 'unavailable', 'none', ''] %} (Projected £{{ '%.2f' | format(money | float(0)) }}){% endif %}
              - **Year:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_year_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}{% set money = states('sensor.kirk_hill_wind_farm_generation_value_year_owner') %}{% if money not in ['unknown', 'unavailable', 'none', ''] %} (Projected £{{ '%.2f' | format(money | float(0)) }}){% endif %}
              - **All time:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_alltime_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}{% set money = states('sensor.kirk_hill_wind_farm_generation_value_alltime_owner') %}{% if money not in ['unknown', 'unavailable', 'none', ''] %} (Projected £{{ '%.2f' | format(money | float(0)) }}){% endif %}
          - type: entities
            title: Owner projected earnings
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_generation_value_yesterday_owner
                name: Yesterday
              - entity: sensor.kirk_hill_wind_farm_generation_value_today_owner
                name: Today
              - entity: sensor.kirk_hill_wind_farm_generation_value_week_owner
                name: Week
              - entity: sensor.kirk_hill_wind_farm_generation_value_month_owner
                name: Month
              - entity: sensor.kirk_hill_wind_farm_generation_value_ytd_owner
                name: YTD
              - entity: sensor.kirk_hill_wind_farm_generation_value_year_owner
                name: Year
              - entity: sensor.kirk_hill_wind_farm_generation_value_alltime_owner
                name: All time
          - type: entities
            title: Owner metrics
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_power_owner
                name: Owner power
              - entity: sensor.kirk_hill_wind_farm_capacity_factor_owner
                name: Owner capacity factor
          - type: history-graph
            title: Owner and wind (last 6 hours)
            hours_to_show: 6
            entities:
              - sensor.kirk_hill_wind_farm_power_owner
              - sensor.kirk_hill_wind_farm_wind_speed

      - type: grid
        cards:
          - type: heading
            heading: Whole site
            heading_style: title
          - type: markdown
            title: Site generation
            content: |
              - **Yesterday:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_yesterday_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **Today:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_today_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **Week:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_week_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **Month:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_month_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **YTD:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_ytd_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **Year:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_year_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **All time:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_alltime_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
          - type: entities
            title: Site metrics
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_power_site
                name: Site power
              - entity: sensor.kirk_hill_wind_farm_capacity_factor_site
                name: Site capacity factor
              - entity: sensor.kirk_hill_wind_farm_wind_speed
                name: Wind speed
          - type: history-graph
            title: Site and wind (last 6 hours)
            hours_to_show: 6
            entities:
              - sensor.kirk_hill_wind_farm_power_site
              - sensor.kirk_hill_wind_farm_wind_speed
  - title: Finances
    path: finances
    icon: mdi:cash-multiple
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Finances
            heading_style: title
            icon: mdi:cash-multiple
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Published books (enter current figures)
            heading_style: title
          - type: entities
            title: Published books inputs
            show_header_toggle: false
            entities:
              - entity: number.kirk_hill_wind_farm_published_books_revenue
                name: Revenue
              - entity: number.kirk_hill_wind_farm_published_books_operating_costs
                name: Operating costs
              - entity: number.kirk_hill_wind_farm_published_books_finance_costs
                name: Finance costs
              - entity: number.kirk_hill_wind_farm_published_books_other_costs
                name: Other costs
              - entity: number.kirk_hill_wind_farm_published_books_owner_distribution
                name: Owner distribution
          - type: markdown
            title: Published books totals
            content: |
              - **Site net after costs:** {% set rev = states('number.kirk_hill_wind_farm_published_books_revenue') | float(0) %}{% set op = states('number.kirk_hill_wind_farm_published_books_operating_costs') | float(0) %}{% set fin = states('number.kirk_hill_wind_farm_published_books_finance_costs') | float(0) %}{% set other = states('number.kirk_hill_wind_farm_published_books_other_costs') | float(0) %}£{{ '%.2f' | format(rev - op - fin - other) }}
              - **Owner distribution:** £{{ '%.2f' | format(states('number.kirk_hill_wind_farm_published_books_owner_distribution') | float(0)) }}
      - type: grid
        cards:
          - type: heading
            heading: Owner finances
            heading_style: title
          - type: entities
            title: Owner projected earnings by timeframe
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_generation_value_yesterday_owner
                name: Yesterday
              - entity: sensor.kirk_hill_wind_farm_generation_value_today_owner
                name: Today
              - entity: sensor.kirk_hill_wind_farm_generation_value_week_owner
                name: Week
              - entity: sensor.kirk_hill_wind_farm_generation_value_month_owner
                name: Month
              - entity: sensor.kirk_hill_wind_farm_generation_value_ytd_owner
                name: YTD
              - entity: sensor.kirk_hill_wind_farm_generation_value_year_owner
                name: Year
              - entity: sensor.kirk_hill_wind_farm_generation_value_alltime_owner
                name: All time
      - type: grid
        cards:
          - type: heading
            heading: Site finances
            heading_style: title
          - type: entities
            title: Site projected value by timeframe
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_generation_value_yesterday_site
                name: Yesterday
              - entity: sensor.kirk_hill_wind_farm_generation_value_today_site
                name: Today
              - entity: sensor.kirk_hill_wind_farm_generation_value_week_site
                name: Week
              - entity: sensor.kirk_hill_wind_farm_generation_value_month_site
                name: Month
              - entity: sensor.kirk_hill_wind_farm_generation_value_ytd_site
                name: YTD
              - entity: sensor.kirk_hill_wind_farm_generation_value_year_site
                name: Year
              - entity: sensor.kirk_hill_wind_farm_generation_value_alltime_site
                name: All time
  - title: Turbines
    path: turbines
    icon: mdi:wind-turbine
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: Turbine status overview
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_active_turbines
                name: Active turbines
              - entity: sensor.kirk_hill_wind_farm_inactive_turbines
                name: Inactive turbines
              - entity: binary_sensor.kirk_hill_wind_farm_alarm
                name: Alarm
          - type: custom:kirkhill-wind-turbine-map
            title: Turbine map
            zoom: 15
            turbines:
              - name: T1
                state_entity: sensor.turbine_t1_state
                power_entity: sensor.turbine_t1_power_site
                capacity_entity: sensor.turbine_t1_capacity_factor_site
                active_entity: binary_sensor.turbine_t1_active
