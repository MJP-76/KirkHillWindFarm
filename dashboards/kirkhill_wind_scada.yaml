              - entity: sensor.turbine_t1_power_site
                name: Site power
              - entity: sensor.turbine_t1_state
                name: State
              - entity: binary_sensor.turbine_t1_active
                name: Active
          - type: entities
            title: Turbine T2
            entities:
              - entity: sensor.turbine_t2_power_owner
                name: Owner power
              - entity: sensor.turbine_t2_power_site
                name: Site power
              - entity: sensor.turbine_t2_state
