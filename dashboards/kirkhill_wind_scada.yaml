              - **Month:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_month_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000000000000000 %}{{ '%.2f' | format(n / 1000000000000000) }} EWh{% elif n >= 1000000000000 %}{{ '%.2f' | format(n / 1000000000000) }} PWh{% elif n >= 1000000000 %}{{ '%.2f' | format(n / 1000000000) }} TWh{% elif n >= 1000000 %}{{ '%.2f' | format(n / 1000000) }} GWh{% elif n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **YTD:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_ytd_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000000000000000 %}{{ '%.2f' | format(n / 1000000000000000) }} EWh{% elif n >= 1000000000000 %}{{ '%.2f' | format(n / 1000000000000) }} PWh{% elif n >= 1000000000 %}{{ '%.2f' | format(n / 1000000000) }} TWh{% elif n >= 1000000 %}{{ '%.2f' | format(n / 1000000) }} GWh{% elif n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **Year:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_year_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000000000000000 %}{{ '%.2f' | format(n / 1000000000000000) }} EWh{% elif n >= 1000000000000 %}{{ '%.2f' | format(n / 1000000000000) }} PWh{% elif n >= 1000000000 %}{{ '%.2f' | format(n / 1000000000) }} TWh{% elif n >= 1000000 %}{{ '%.2f' | format(n / 1000000) }} GWh{% elif n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **All time:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_alltime_site', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000000000000000 %}{{ '%.2f' | format(n / 1000000000000000) }} EWh{% elif n >= 1000000000000 %}{{ '%.2f' | format(n / 1000000000000) }} PWh{% elif n >= 1000000000 %}{{ '%.2f' | format(n / 1000000000) }} TWh{% elif n >= 1000000 %}{{ '%.2f' | format(n / 1000000) }} GWh{% elif n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
          - type: entities
            title: Site metrics
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_power_site
                name: Site power
              - entity: sensor.kirk_hill_wind_farm_capacity_factor_site
                name: Site capacity factor
              - entity: sensor.kirk_hill_wind_farm_wind_speed
                name: Actual wind speed (Kirk Hill API)

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Charts
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: Power and Wind (last 25 hours)
            hours_to_show: 25
            entities:
              - sensor.kirk_hill_wind_farm_power_owner
              - sensor.kirk_hill_wind_farm_power_site
              - sensor.kirk_hill_wind_farm_wind_speed
          - type: custom:apexcharts-card
            graph_span: 25h
            apex_config:
              legend:
                show: false
              stroke:
                width: 2
            header:
              show: true
              title: "Power — Owner (blue) / Site (orange)"
              show_states: true
              colorize_states: true
            series:
              - entity: sensor.kirk_hill_wind_farm_power_owner
                fill_raw: last
                color: blue
                unit: kW
                type: area
              - entity: sensor.kirk_hill_wind_farm_power_site
                fill_raw: last
                color: orange
                unit: kW
                transform: "return x * 1000;"
                type: area
          - type: custom:plotly-graph
            hours_to_show: 25
            refresh_interval: auto
            entities:
              - entity: sensor.kirk_hill_wind_farm_power_owner
                y_axis: y
                line:
                  width: 2
              - entity: sensor.kirk_hill_wind_farm_power_site
                y_axis: y2
                line:
                  width: 2
              - entity: sensor.kirk_hill_wind_farm_wind_speed
                y_axis: y3
                line:
                  width: 1
                  dash: dot
            layout:
              title: "Power & Wind (25h)"
              yaxis:
                title: Owner (kW)
                side: left
              yaxis2:
                title: Site (kW)
                overlaying: y
                side: right
              yaxis3:
                title: Wind (m/s)
                overlaying: y
                side: right
                showgrid: false

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Wind Forecast
            heading_style: title
            icon: mdi:weather-partly-cloudy
          - type: entities
            title: Open-Meteo forecasts
            show_header_toggle: false
            entities:
              - entity: sensor.kirk_hill_wind_farm_open_meteo_forecast_wind_next_hour
                name: Forecast next hour (Open-Meteo)
              - entity: sensor.kirk_hill_wind_farm_open_meteo_forecast_wind_next_3h_avg
                name: Forecast next 3h avg (Open-Meteo)
              - entity: sensor.kirk_hill_wind_farm_open_meteo_forecast_wind_next_24h_avg
                name: Forecast next 24h avg (Open-Meteo)
          - type: markdown
            title: Today's summary
            content: |
              - **Generation:** {% set v = state_attr('sensor.kirk_hill_wind_farm_generation_today_owner', 'raw_generation_kwh') %}{% if v is not none %}{% set n = v | float(0) %}{% if n >= 1000000000000000 %}{{ '%.2f' | format(n / 1000000000000000) }} EWh{% elif n >= 1000000000000 %}{{ '%.2f' | format(n / 1000000000000) }} PWh{% elif n >= 1000000000 %}{{ '%.2f' | format(n / 1000000000) }} TWh{% elif n >= 1000000 %}{{ '%.2f' | format(n / 1000000) }} GWh{% elif n >= 1000 %}{{ '%.2f' | format(n / 1000) }} MWh{% else %}{{ '%.2f' | format(n) }} kWh{% endif %}{% else %}—{% endif %}
              - **Projected value:** {% set v = states('sensor.kirk_hill_wind_farm_generation_value_today_owner') %}{% if v and v != 'unknown' %}£{{ v }}{% else %}—{% endif %}

  - title: Finances
