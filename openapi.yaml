        latest_generation_interval_end:
          type:
            - string
            - 'null'
          format: date-time
        latest_rotor_speed_rpm:
          type:
            - number
            - 'null'
          format: double
        latest_rotor_speed_at:
          type:
            - string
            - 'null'
          format: date-time
        coordinates:
          $ref: '#/components/schemas/Coordinates'
    TurbinesResponse:
