reload_integration:
  name: Reload integration
  description: Reload the Kirk Hill Wind Farm integration config entry.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to reload. If omitted, the first Kirk Hill Wind Farm entry is reloaded.
      required: false
      selector:
        text:

reset_dashboard:
  name: Reset dashboard
  description: Reset the Kirk Hill Wind Farm dashboard to default layout, discarding any customisations.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to reset. If omitted, the first entry is reset.
      required: false
      selector:
        text:

add_payment_record:
  name: Add payment record
  description: >-
    Record one period the board has declared a per-watt rate for. The Return on
    investment panel's add & edit forms write through this service; the ledger
    stores it and the panel and modal figures follow.
  fields:
    period_start:
      name: Period start
      description: First day the declared rate covers (YYYY-MM-DD).
      required: true
      selector:
        date:
    period_end:
      name: Period end
      description: Last day the declared rate covers (YYYY-MM-DD).
      required: true
      selector:
        date:
    rate_p_per_w:
      name: Rate (p/W)
      description: Per-watt rate the board announced for this period, in pence.
      required: true
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.1
          mode: box
    capacity_watts:
      name: Capacity (W)
      description: >-
        Watts owned when this period was declared. Defaults to the owner capacity
        reported by the API; supplied explicitly for historical periods.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 1
          mode: box
    announced_on:
      name: Announced on
      description: Date the board announced the figure, if different from the period.
      required: false
      selector:
        date:
    note:
      name: Note
      description: Free-text context, such as the AGM or meeting that declared it.
      required: false
      selector:
        text:
    source:
      name: Source
      description: >-
        "board" when the figure was announced by the board, "self" for your own
        estimate of a period the board has not declared yet. Omitted means
        "board".
      required: false
      selector:
        select:
          options:
            - board
            - self
    capital_gbp:
      name: Capital (GBP)
      description: >-
        Capital half of this period's payment, from an Ethex statement or a
        board announcement. Either half may be omitted; when both are given
        they must sum to the period's figure to the penny.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    interest_gbp:
      name: Interest (GBP)
      description: >-
        Interest half of this period's payment. Omit it and it is worked out
        as the period's figure minus the capital you entered.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    entry_id:
      name: Entry ID
      description: Optional config entry ID. If omitted, the first entry is used.
      required: false
      selector:
        text:

update_payment_record:
  name: Update payment record
  description: >-
    Change one stored payment record. Payment dates are not final, so a period
    is expected to be edited after the fact.
  fields:
    record_id:
      name: Record ID
      description: ID of the record to change, from the payment ledger sensor's records attribute.
      required: true
      selector:
        text:
    period_start:
      name: Period start
      description: New first day the declared rate covers.
      required: false
      selector:
        date:
    period_end:
      name: Period end
      description: New last day the declared rate covers.
      required: false
      selector:
        date:
    rate_p_per_w:
      name: Rate (p/W)
      description: New per-watt rate in pence.
      required: false
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.1
          mode: box
    capacity_watts:
      name: Capacity (W)
      description: New watts owned for this period.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 1
          mode: box
    announced_on:
      name: Announced on
      description: New announcement date.
      required: false
      selector:
        date:
    note:
      name: Note
      description: New free-text context.
      required: false
      selector:
        text:
    source:
      name: Source
      description: Switch between a board announcement and your own estimate.
      required: false
      selector:
        select:
          options:
            - board
            - self
    capital_gbp:
      name: Capital (GBP)
      description: >-
        Capital half of this period's payment. Both halves must sum to the
        period's figure to the penny when both are given.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    interest_gbp:
      name: Interest (GBP)
      description: Interest half of this period's payment.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    entry_id:
      name: Entry ID
      description: Optional config entry ID. If omitted, the first entry is used.
      required: false
      selector:
        text:

remove_payment_record:
  name: Remove payment record
  description: Delete one stored payment record from the ledger.
  fields:
    record_id:
      name: Record ID
      description: ID of the record to remove, from the payment ledger sensor's records attribute.
      required: true
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. If omitted, the first entry is used.
      required: false
      selector:
        text:

set_invested_amount:
  name: Set invested amount
  description: >-
    Record what the member invested so the ROI card can quote each period's
    return against that capital. Send null to clear it back to "not told" --
    an unknown investment is a different statement from having invested
    nothing.
  fields:
    invested_gbp:
      name: Invested (GBP)
      description: Capital invested in pounds; null clears the figure.
      required: true
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.01
          mode: box
    entry_id:
      name: Entry ID
      description: Optional config entry ID. If omitted, the first entry is used.
      required: false
      selector:
        text:

set_projection:
  name: Set projection
  description: >-
    Record the annual rate and lifespan behind the projection line on the ROI
    card. Normally the board's own published annual equivalent — its February
    2025 to June 2026 announcement equated 21 p/W over 17 months to 15 p/W
    over 12. It is a labelled projection only: it changes no total and fills
    no period. Send null for either input to clear it.
  fields:
    annual_rate_p_per_w:
      name: Annual rate (p/W per year)
      description: The p/W figure the projection assumes each year.
      required: true
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.1
          mode: box
    lifespan_years:
      name: Lifespan (years)
      description: How many years to run the projection over, e.g. 25.
      required: true
      selector:
        number:
          min: 1
          max: 200
          step: 1
          mode: box
    entry_id:
      name: Entry ID
      description: Optional config entry ID. If omitted, the first entry is used.
      required: false
      selector:
        text:
